[project]
name = "medical-triage-mlops"
version = "0.1.0"
description = "Tech Challenge Fase 3 (MLET/POSTECH) — triagem automática de laudos médicos: deploy em nuvem, pipeline CI/CD, orquestração de retreino e monitoramento com otimização de latência"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
    "skl2onnx>=1.17",
    "onnxruntime>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]
